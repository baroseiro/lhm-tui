# Source of truth for the release pipeline (cargo-dist). After editing this
# file, regenerate the workflow with the same dist version:
#   dist generate        # rewrites .github/workflows/release.yml
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-pc-windows-msvc", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Build the Windows ARM64 target NATIVELY on GitHub's ARM64 Windows runner.
# dist's default for this triple is a Linux cargo-xwin cross build, which
# breaks on `ring`'s C code (MSVC-style `/imsvc` flags reach plain clang);
# `host == target` makes dist skip the cross wrapper and run a plain
# `cargo build --target aarch64-pc-windows-msvc`.
[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "windows-11-arm"
host = "aarch64-pc-windows-msvc"
